name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/decode-z0r0/gitops-demo-app:${{ steps.vars.outputs.short }}
            ghcr.io/decode-z0r0/gitops-demo-app:latest

      - name: Update image tag in manifests repo
        env:
          TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
          TAG: ${{ steps.vars.outputs.short }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/DECODE-z0r0/gitops-demo-manifests.git
          cd gitops-demo-manifests
          sed -i "s|image: ghcr.io/decode-z0r0/gitops-demo-app:.*|image: ghcr.io/decode-z0r0/gitops-demo-app:${TAG}|" apps/demo-app/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Deploy demo-app ${TAG}"
          git push
